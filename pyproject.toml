[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speakingt"
version = "0.1.0"
description = "Local-first English speech measurements and supervised fluency research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
audio = ["av>=11,<19"]
asr = ["faster-whisper>=1.1,<2"]
record = ["sounddevice>=0.4,<1"]

[project.scripts]
speakingt = "speakingt.cli:main"

[tool.setuptools.packages.find]
include = ["speakingt*"]
