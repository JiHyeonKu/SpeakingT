[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speakingt"
version = "0.1.0"
description = "Local-first English speech measurements and supervised fluency research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
audio = ["av>=11,<19"]
asr = ["faster-whisper>=1.1,<2"]
record = ["sounddevice>=0.4,<1"]
research = ["torch>=2.6,<3", "matplotlib>=3.8,<4", "jupyterlab>=4,<5", "tensorboard>=2.17,<3", "nbclient>=0.10,<1"]
ssl = ["transformers==4.57.6", "safetensors>=0.4.3,<1", "psutil>=7,<8"]

[project.scripts]
speakingt = "speakingt.cli:main"

[tool.setuptools.packages.find]
include = ["speakingt*"]

[tool.setuptools.package-data]
"speakingt.vendor" = ["GOPT-LICENSE"]
